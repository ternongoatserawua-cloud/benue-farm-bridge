<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#15803d">
  <title>Offline — Benue Farm Bridge</title>
  <style>
    :root {
      --primary: #15803d;
      --primary-dark: #064e3b;
      --gold: #d97706;
      --bg: #0b1510;
      --card-bg: #13241b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #132e20 0%, var(--bg) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: rgba(19, 36, 27, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon-wrapper {
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      border-radius: 22px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(22, 163, 74, 0.4);
      position: relative;
    }
    .icon-wrapper img {
      width: 56px;
      height: 56px;
    }
    .badge-offline {
      position: absolute;
      bottom: -6px;
      right: -6px;
      background: #ef4444;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 9999px;
      border: 2px solid var(--card-bg);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
      color: #ffffff;
    }
    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.55;
      margin-bottom: 28px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.35);
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-secondary:active {
      background: rgba(255, 255, 255, 0.12);
    }
    .status-text {
      margin-top: 24px;
      font-size: 13px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #f59e0b;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-wrapper">
      <img src="/pwa-icon.svg" alt="Benue Farm Bridge Logo" onerror="this.src='/logo.png'">
      <span class="badge-offline">Offline</span>
    </div>

    <h1>You Are Offline</h1>
    <p>
      It looks like your internet connection is unavailable. Don't worry, previously loaded listings and saved items are stored on your device.
    </p>

    <div class="btn-group">
      <button class="btn btn-primary" id="retryBtn" onclick="handleRetry()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2v6h-6"></path>
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
          <path d="M3 22v-6h6"></path>
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
        </svg>
        Retry Connection
      </button>

      <a href="/" class="btn btn-secondary">
        Return to Cached App
      </a>
    </div>

    <div class="status-text" id="statusMessage">
      <span class="pulse-dot"></span> Listening for internet connection...
    </div>
  </div>

  <script>
    function handleRetry() {
      const btn = document.getElementById('retryBtn');
      btn.innerHTML = 'Checking...';
      btn.style.opacity = '0.7';
      if (navigator.onLine) {
        window.location.reload();
      } else {
        setTimeout(() => {
          btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg> Retry Connection';
          btn.style.opacity = '1';
        }, 800);
      }
    }

    window.addEventListener('online', () => {
      const msg = document.getElementById('statusMessage');
      msg.innerHTML = '<span style="color:#22c55e;">✓ Connection restored! Reloading...</span>';
      setTimeout(() => {
        window.location.href = '/';
      }, 1000);
    });
  </script>
</body>
</html>
